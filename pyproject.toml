[build-system]
requires = [
    "setuptools>=77.0.3",
    "torch>=2.10.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "hirschberg-viterbi"
version = "0.1.0"
description = "Memory-efficient forced alignment for long sequences."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    {name = "Lawry Sorenson", email = "lawrysorenson@byu.edu"}
]
dependencies = [
    "torch>=2.10.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: POSIX :: Linux"
]

[tool.setuptools.packages.find]
include = ["hirschberg_viterbi*"]
exclude = ["tests*"]

[dependency-groups]
dev = [
    "numpy>=2.2.6",
    "torchaudio>=2.11.0",
]

[project.urls]
Homepage = "https://github.com/byu-matrix-lab/hirschberg-viterbi"
Issues = "https://github.com/byu-matrix-lab/hirschberg-viterbi/issues"
